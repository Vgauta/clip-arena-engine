name: render

# Renders clips for each new file pushed to requests/, then publishes the MP4s as a GitHub release
# so vidIQ can import them by public link.
on:
  push:
    paths:
      - "requests/*.json"
  workflow_dispatch:
    inputs:
      request:
        description: "Path of a request file, e.g. requests/2026-11-19-01.json"
        required: true
      force:
        description: "Render again even if already rendered"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: engine-state
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WHISPER_MODEL: small.en
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -U -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}

      - name: Optional YouTube cookies (secret YT_COOKIES)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Find requests to render
        id: find
        env:
          INPUT_REQUEST: ${{ inputs.request || '' }}
        run: |
          if [ -n "$INPUT_REQUEST" ]; then
            echo "$INPUT_REQUEST" > todo.txt
          else
            git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'requests/*.json' > todo.txt || true
          fi
          cat todo.txt

      - name: Render and publish
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          while read -r req; do
            [ -z "$req" ] && continue
            id=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['request_id'])" "$req")
            tag="clips-$id"
            base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
            rm -rf out && mkdir out
            python -m engine.render "$req" --release-base "$base" $FORCE
            if ls out/*.mp4 >/dev/null 2>&1; then
              gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease \
                --title "Clips $id" --notes "Rendered from $req. Source: Tomo's YouTube (@Tomovids), clipped for the approved campaign."
              gh release upload "$tag" out/* --clobber
              for f in out/*.mp4; do
                code=$(curl -s -o /dev/null -w "%{http_code}" -L "$base/$(basename "$f")")
                echo "Public link check $(basename "$f"): $code"
              done
            fi
          done < todo.txt

      - name: Save results
        if: always()
        run: |
          git config user.name "clip-engine-bot"
          git config user.email "clip-engine-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "render: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
