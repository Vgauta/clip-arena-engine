name: scan

# Finds new approved source videos and scores them for clip-worthy moments.
# Runs daily at 17:00 IST, before the daily Claude task picks clips at about 19:30 IST.
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      campaign:
        description: "Campaign key from config/campaigns.yaml"
        default: "tomo_gta6"
      video:
        description: "Optional: scan only this YouTube video id or URL"
        default: ""
      force:
        description: "Rescan even if already scanned"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: engine-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CAMPAIGN: ${{ inputs.campaign || 'tomo_gta6' }}
      VIDEO: ${{ inputs.video || '' }}
      FORCE: ${{ inputs.force && '--force' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2   # yt-dlp needs a JavaScript runtime for YouTube
        with:
          deno-version: v2.x

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -U -r requirements.txt
          yt-dlp --version

      - name: Optional YouTube cookies (secret YT_COOKIES)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
            echo "Using cookies"
          fi

      - name: Scan
        run: |
          if [ -n "$VIDEO" ]; then
            python -m engine.scan --campaign "$CAMPAIGN" --video "$VIDEO" $FORCE
          else
            python -m engine.scan --campaign "$CAMPAIGN" $FORCE
          fi

      - name: Save results
        if: always()
        run: |
          git config user.name "clip-engine-bot"
          git config user.email "clip-engine-bot@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "scan: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
